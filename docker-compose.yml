services:
  claude-code:
    build:
      context: .
      args:
        USERNAME: developer
        USER_UID: 1000
        USER_GID: 1000
    image: claude-code-dev
    container_name: claude-code-dev
    stdin_open: true
    tty: true
    volumes:
      # Mount your local project directory here
      - ${PROJECT_DIR:-.}:/workspace
      # Persist Claude login credentials between container restarts
      - claude-auth:/home/developer/.claude
    working_dir: /workspace

volumes:
  claude-auth:
