services:
  claude-code:
    build: .
    image: claude-code-dev
    container_name: claude-code-dev
    stdin_open: true
    tty: true
    volumes:
      # Mount your local project directory here
      - ${PROJECT_DIR:-.}:/workspace
      # Persist Claude login credentials between container restarts
      - claude-auth:/root/.claude
    working_dir: /workspace

volumes:
  claude-auth:
